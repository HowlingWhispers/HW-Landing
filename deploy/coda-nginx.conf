# Add INSIDE the existing thehowlingwhispers.com HTTPS server block.
# Keep the existing welcome-page root and other routes.
location ^~ /coda/api/ {
    proxy_pass http://127.0.0.1:3218;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    client_max_body_size 32k;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location = /coda {
    root /var/www/thehowlingwhispers.com;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-TmxPsJrtM6gEOF5kLKRfHGuzzTxL92lGVS5XNJV+hS8='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    rewrite ^ /index.html break;
}
location /coda/ {
    root /var/www/thehowlingwhispers.com;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    rewrite ^ /index.html break;
}
