# REQUIRED for zero-config CodaLauncher installs.
# Add this inside the existing thehowlingwhispers.com HTTPS server block.
# Keep the launcher-feed service bound to 127.0.0.1 or otherwise firewalled if desired.
location /launcher/ {
    proxy_pass http://127.0.0.1:3220/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    add_header X-Content-Type-Options nosniff always;
}
