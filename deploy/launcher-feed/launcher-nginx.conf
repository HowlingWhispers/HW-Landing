# OPTIONAL. A domain is not required for the direct-IP prototype.
# If this is later placed behind the existing Howling Whispers HTTPS vhost,
# change LAUNCHER_FEED_HOST to 127.0.0.1 and add:
location /launcher/ {
    proxy_pass http://127.0.0.1:3220/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    add_header X-Content-Type-Options nosniff always;
}
